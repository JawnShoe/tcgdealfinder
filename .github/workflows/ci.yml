name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code (push)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            non_docs:
              - "**"
              - "!**/*.md"
              - "!docs/**"

      - name: Detect docs-only change (push)
        id: changes_push
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            non_docs:
              - "**"
              - "!**/*.md"
              - "!docs/**"

      - name: Set non-docs flag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NON_DOCS=${{ steps.changes.outputs.non_docs }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "NON_DOCS=${{ steps.changes_push.outputs.non_docs }}" >> $GITHUB_ENV
          else
            echo "NON_DOCS=true" >> $GITHUB_ENV
          fi

      - name: Docs-only fast path
        if: env.NON_DOCS != 'true'
        run: |
          echo "Docs-only PR detected (only *.md and/or docs/** changes)."
          echo "Skipping formatting, lint, tests, and build to reduce Actions minutes."

      - name: Checkout code
        if: env.NON_DOCS == 'true' && github.event_name != 'push'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        if: env.NON_DOCS == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        if: env.NON_DOCS == 'true'
        run: npm ci

      - name: Cache Next.js build
        if: env.NON_DOCS == 'true'
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Check formatting (changed files only)
        if: env.NON_DOCS == 'true'
        run: |
          # Get base branch for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="origin/main"
          fi

          # Get list of changed files with supported extensions
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA HEAD | grep -E '\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No formattable files changed, skipping Prettier check"
            exit 0
          fi

          echo "Checking formatting on changed files:"
          echo "$CHANGED_FILES"
          echo "$CHANGED_FILES" | xargs npx prettier --check

      - name: Run lint
        if: env.NON_DOCS == 'true'
        run: npm run lint

      - name: Run typecheck
        if: env.NON_DOCS == 'true'
        run: npx tsc --noEmit

      - name: Run unit tests
        if: env.NON_DOCS == 'true'
        run: npm run test:unit

      - name: Run build
        if: env.NON_DOCS == 'true'
        run: npm run build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tcg_deals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tcg_deals"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tcg_deals
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize DB schema
        run: npx tsx scripts/init-db.ts

      - name: Seed rebuild E2E listing
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tcg_deals -f tests/fixtures/rebuild_seed.sql

      - name: Run Playwright E2E smoke (1)
        run: npx playwright test tests/e2e/rebuild-trust-panel.spec.ts --config tests/e2e/playwright.config.ts

      - name: Run Playwright E2E smoke (2)
        run: npx playwright test tests/e2e/rebuild-trust-panel.spec.ts --config tests/e2e/playwright.config.ts

  visual-regression:
    name: Visual Regression / CLS
    runs-on: ubuntu-latest

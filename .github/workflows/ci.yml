      - name: Run CLS gate
        run: npx playwright test tests/e2e/rebuild-cls.spec.ts --config tests/e2e/playwright.config.ts

  a11y-smoke:
    name: A11y Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tcg_deals
        ports:
          - 5432:5432
        options: >-

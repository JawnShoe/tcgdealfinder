name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Detect docs-only change
        id: changes
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: "every"
          filters: |
            non_docs:
              - "**"
              - "!**/*.md"
              - "!docs/**"

      - name: Docs-only fast path
        if: steps.changes.outputs.non_docs != 'true'
        run: |
          echo "Docs-only PR detected (only *.md and/or docs/** changes)."
          echo "Skipping formatting, lint, tests, and build to reduce Actions minutes."

      - name: Checkout code
        if: steps.changes.outputs.non_docs == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.changes.outputs.non_docs == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        if: steps.changes.outputs.non_docs == 'true'
        run: npm ci

      - name: Cache Next.js build
        if: steps.changes.outputs.non_docs == 'true'
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Check formatting (changed files only)
        if: steps.changes.outputs.non_docs == 'true'
        run: |
          # Get base branch for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="origin/main"
          fi

          # Get list of changed files with supported extensions
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA HEAD | grep -E '\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No formattable files changed, skipping Prettier check"
            exit 0
          fi

          echo "Checking formatting on changed files:"
          echo "$CHANGED_FILES"
          echo "$CHANGED_FILES" | xargs npx prettier --check

      - name: Run lint
        if: steps.changes.outputs.non_docs == 'true'
        run: npm run lint

      - name: Run unit tests
        if: steps.changes.outputs.non_docs == 'true'
        run: npm run test:unit

      - name: Run build
        if: steps.changes.outputs.non_docs == 'true'
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Debug DATABASE_URL hostname
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL hostname: $(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")"
          else
            echo "DATABASE_URL is not set"
          fi

      - name: Run build
        run: npm run build

name: Data Pipelines

# Automated data refresh pipelines
# These jobs run on schedule to keep deal data fresh.
# All jobs are idempotent and safe to rerun.
#
# Required secrets (set in GitHub repo settings → Secrets → Actions):
# - DATABASE_URL: Postgres connection string (required)
# - EBAY_APP_ID: eBay API app ID, also used as client ID (required)
# - EBAY_CLIENT_SECRET: eBay API client secret for OAuth2 (required)
# - OPEN_EXCHANGE_RATES_APP_ID: Open Exchange Rates app ID (required for automated FX runs)
# - SENDGRID_API_KEY: SendGrid API key for alert emails (optional)
#
# First-run validation:
# 1. Set all required secrets in repo settings
# 2. Run workflow manually: Actions → Data Pipelines → Run workflow
# 3. Select "update-listings" job to test eBay API + DB connection
# 4. Verify job completes successfully before relying on scheduled runs

on:
  schedule:
    # Update listings every 30 minutes
    - cron: "*/30 * * * *"
    # Check alerts every 15 minutes
    - cron: "*/15 * * * *"
    # Update historical prices daily at 3 AM UTC
    - cron: "0 3 * * *"
    # Update sold listings daily at 4 AM UTC
    - cron: "0 4 * * *"
    # Update FX rates hourly (Option A Phase 0)
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options:
          - update-listings
          - check-alerts
          - update-fx-rates
          - show-fx-rates
          - update-historical-prices
          - update-sold-listings
          - all

# Prevent concurrent runs of the same job to avoid DB conflicts
concurrency:
  group: data-pipelines-${{ github.event.schedule || github.event.inputs.job || 'manual' }}
  cancel-in-progress: false

# Minimal permissions - read-only access to repo contents
permissions:
  contents: read

# Fork guard: scheduled workflows only run on the main repo
# Forks can still use workflow_dispatch manually

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
  EBAY_CLIENT_ID: ${{ secrets.EBAY_APP_ID }}
  EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
  OPEN_EXCHANGE_RATES_APP_ID: ${{ secrets.OPEN_EXCHANGE_RATES_APP_ID }}
  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

jobs:
  update-listings:
    name: Update Listings
    runs-on: ubuntu-latest
    # Run on */30 schedule OR manual dispatch with 'update-listings' or 'all'
    if: >-
      github.event.schedule == '*/30 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'update-listings' || github.event.inputs.job == 'all'))
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify secrets are set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$EBAY_APP_ID" ]; then
            echo "::error::EBAY_APP_ID secret is not set"
            exit 1
          fi
          if [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "::error::EBAY_CLIENT_SECRET secret is not set"
            exit 1
          fi
          echo "All required secrets are set"

      - name: Run update-listings
        run: npm run listings:update
        env:
          NODE_ENV: production

  check-alerts:
    name: Check Alerts
    runs-on: ubuntu-latest
    # Manual dispatch only until SENDGRID_API_KEY is configured.
    # Once email alerts are ready, restore scheduled runs by adding:
    #   github.event.schedule == '*/15 * * * *' ||
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'check-alerts' || github.event.inputs.job == 'all')
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run check-alerts
        run: npm run alerts:check
        env:
          NODE_ENV: production

  show-fx-rates:
    name: Show FX Rates (Manual Only)
    runs-on: ubuntu-latest
    # Manual dispatch only - no schedule (FX updates require manual input)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'show-fx-rates' || github.event.inputs.job == 'all')
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # FX rate updates require manual rate input via CLI args.
      # This job only displays current rates for monitoring.
      # To update rates: run locally with --currency CAD --rate 0.72
      - name: Show current FX rates
        run: npx tsx scripts/update-fx-rates.ts
        env:
          NODE_ENV: production

  update-fx-rates:
    name: Update FX Rates (Automated)
    runs-on: ubuntu-latest
    # Run on hourly schedule OR manual dispatch
    if: >-
      github.event.schedule == '0 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'update-fx-rates' || github.event.inputs.job == 'all'))
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$OPEN_EXCHANGE_RATES_APP_ID" ]; then
            echo "::error::OPEN_EXCHANGE_RATES_APP_ID secret is not set"
            exit 1
          fi
          echo "Required secrets are set"

      # Automated FX rate update (Option A Phase 0)
      # - Provider: Open Exchange Rates (API key required)
      # - Hard bounds validation + drift gating
      # - Holds last-known on drift/failure
      - name: Update FX rates
        run: npx tsx scripts/update-fx-rates-auto.ts --apply
        env:
          NODE_ENV: production

  update-historical-prices:
    name: Update Historical Prices
    runs-on: ubuntu-latest
    # Run on 0 3 schedule OR manual dispatch
    if: >-
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'update-historical-prices' || github.event.inputs.job == 'all'))
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run update-historical-prices
        run: npm run historicals:update
        env:
          NODE_ENV: production

  update-sold-listings:
    name: Update Sold Listings
    runs-on: ubuntu-latest
    # Run on 0 4 schedule OR manual dispatch
    if: >-
      github.event.schedule == '0 4 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'update-sold-listings' || github.event.inputs.job == 'all'))
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run update-sold-listings
        run: npm run sold:update
        env:
          NODE_ENV: production

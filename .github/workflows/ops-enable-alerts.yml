name: Ops Enablement - Alerts MVP

# Operator workflow for enabling email alerts subsystem.
# This workflow applies the required database migration and runs smoke tests.
#
# Steps for operator:
# 1. Set required secrets: DATABASE_URL, SENDGRID_API_KEY, ALERTS_EMAIL_FROM, SITE_BASE_URL
# 2. Run this workflow with mode="migrate" and confirm="APPLY_MIGRATION_005"
# 3. Run this workflow with mode="e2e_test_email" and test_email=<your-email>
# 4. If e2e test passes (email received), enable scheduled check-alerts in data-pipelines.yml
#
# Security notes:
# - No secrets are printed to logs
# - Migration is idempotent (IF NOT EXISTS)
# - e2e_test_email REQUIRES SENDGRID_API_KEY (hard fail if missing)
# - Test data is cleaned up automatically after the test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "APPLY_MIGRATION_005" to confirm (required for migrate mode)'
        required: true
        type: string
      mode:
        description: "Operation mode"
        required: true
        type: choice
        options:
          - migrate
          - smoke_test
          - e2e_test_email
      test_email:
        description: "TEST_EMAIL allowlist (comma-separated, only these addresses receive test emails)"
        required: false
        type: string

# Prevent concurrent runs
concurrency:
  group: ops-enable-alerts
  cancel-in-progress: false

# Minimal permissions
permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
  ALERTS_EMAIL_FROM: ${{ secrets.ALERTS_EMAIL_FROM }}
  SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}

jobs:
  migrate:
    name: Apply Migration 005
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'migrate'
    timeout-minutes: 5
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY_MIGRATION_005" ]; then
            echo "::error::Confirmation required. Input 'APPLY_MIGRATION_005' to proceed."
            exit 1
          fi
          echo "Confirmation validated."

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Configure it in repo settings."
            exit 1
          fi
          echo "DATABASE_URL is configured (value redacted)."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply migration 005
        run: |
          echo "Applying migrations/005_add_subscription_last_emailed.sql..."
          npx tsx scripts/run-migration.ts migrations/005_add_subscription_last_emailed.sql
          echo "Migration applied successfully."

      - name: Verify migration
        run: npx tsx scripts/verify-migration-005.ts

  smoke-test:
    name: Smoke Test Alerts
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'smoke_test'
    timeout-minutes: 10
    steps:
      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Configure it in repo settings."
            exit 1
          fi
          echo "DATABASE_URL is configured (value redacted)."

      - name: Check SENDGRID configuration
        run: |
          if [ -z "$SENDGRID_API_KEY" ]; then
            echo "::warning::SENDGRID_API_KEY not set. Smoke test will run in dry-run mode (no emails sent)."
          else
            echo "SENDGRID_API_KEY is configured (value redacted)."
          fi
          if [ -z "$ALERTS_EMAIL_FROM" ]; then
            echo "::warning::ALERTS_EMAIL_FROM not set. Email sending will be skipped."
          fi
          if [ -z "$SITE_BASE_URL" ]; then
            echo "::warning::SITE_BASE_URL not set. Unsubscribe links may not work correctly."
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run check-alerts smoke test
        run: |
          echo "Running check-alerts in smoke test mode..."
          # Set TEST_EMAIL_ALLOWLIST to restrict email sending
          export TEST_EMAIL_ALLOWLIST="${{ github.event.inputs.test_email }}"

          # Run the alerts check
          npm run alerts:check

          echo "✅ Smoke test completed successfully."
        env:
          NODE_ENV: production
          TEST_EMAIL_ALLOWLIST: ${{ github.event.inputs.test_email }}

  e2e-test-email:
    name: E2E Test Email Alerts
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'e2e_test_email'
    timeout-minutes: 10
    steps:
      - name: Validate test_email input
        run: |
          if [ -z "${{ github.event.inputs.test_email }}" ]; then
            echo "::error::test_email input is required for e2e_test_email mode."
            exit 1
          fi
          echo "Test email: ${{ github.event.inputs.test_email }}"

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Configure it in repo settings."
            exit 1
          fi
          echo "DATABASE_URL is configured (value redacted)."

      - name: Verify SENDGRID_API_KEY is set
        run: |
          if [ -z "$SENDGRID_API_KEY" ]; then
            echo "::error::SENDGRID_API_KEY secret is not set. E2E test requires email sending capability."
            exit 1
          fi
          echo "SENDGRID_API_KEY is configured (value redacted)."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run E2E alert test
        run: |
          echo "Running E2E alert test..."
          npx tsx scripts/e2e-test-alerts.ts "${{ github.event.inputs.test_email }}"
        env:
          NODE_ENV: production
